# 앱 배포. 환경(stg, prod)과 앱의 조합마다 Application을 만든다.
# 앱은 이미지로 다시 띄울 수 있어 Git에서 지운 리소스를 자동으로 정리한다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: choimory-dev-apps
  namespace: infrastructure
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: stg
                - env: prod
          - list:
              elements:
                - component: member-api
                - component: front
  template:
    metadata:
      name: choimory-dev-{{ .env }}-{{ .component }}
    spec:
      project: choimory-dev
      source:
        repoURL: https://github.com/choimory/choimory-gitops.git
        targetRevision: main
        path: projects/choimory-dev/{{ .component }}/overlays/{{ .env }}
      destination:
        server: https://kubernetes.default.svc
        namespace: choimory-dev-{{ .env }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # ApplicationSet의 Application은 생성 순서가 없어 네임스페이스가 준비될 때까지 재시도한다.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
