# prod 환경 Redis
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: choimory-dev-prod

resources:
  - ../../base
  - choimory-dev-redis-secret.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: choimory-dev-redis
      spec:
        template:
          spec:
            containers:
              - name: choimory-dev-redis
                # 재시작해도 사용자가 로그아웃되지 않도록 prod는 AOF를 켠다.
                args:
                  - --requirepass
                  - $(REDIS_PASSWORD)
                  - --appendonly
                  - "yes"
                  - --appendfsync
                  - everysec
                  - --maxmemory
                  - 100mb
                resources:
                  requests:
                    cpu: 50m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
  # tailnet 기기 이름
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: choimory-dev-redis-tailnet
        annotations:
          tailscale.com/hostname: choimory-dev-redis-prod
