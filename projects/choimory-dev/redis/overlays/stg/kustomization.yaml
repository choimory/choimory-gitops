# stg 환경 Redis. 운영보다 적은 자원을 사용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: choimory-dev-stg

resources:
  - ../../base
  - choimory-dev-redis-secret.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: choimory-dev-redis
      spec:
        template:
          spec:
            containers:
              - name: choimory-dev-redis
                # stg는 재시작 시 토큰이 사라져도 되므로 AOF와 스냅샷을 끈다.
                args:
                  - --requirepass
                  - $(REDIS_PASSWORD)
                  - --appendonly
                  - "no"
                  - --save
                  - ""
                  - --maxmemory
                  - 32mb
                resources:
                  requests:
                    cpu: 50m
                    memory: 16Mi
                  limits:
                    memory: 64Mi
  # tailnet 기기 이름
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: choimory-dev-redis-tailnet
        annotations:
          tailscale.com/hostname: choimory-dev-redis-stg
