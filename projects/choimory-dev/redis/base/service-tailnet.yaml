# tailnet에서 Redis에 접속하기 위한 Service. member-api는 choimory-dev-redis Service를 그대로 쓴다.
# Tailscale Operator가 이 Service를 tailnet 기기로 노출한다. 기기 이름은 환경별 overlay에서 지정한다.
# 주의: choimory-dev-protected는 prune이 꺼져 있어, 이 파일을 지워도 Service는 남는다. 직접 삭제해야 tailnet 기기도 사라진다.
apiVersion: v1
kind: Service
metadata:
  name: choimory-dev-redis-tailnet
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: choimory-dev-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
