# prod 환경 member-api
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: choimory-dev-prod

resources:
  - ../../base

images:
  - name: ghcr.io/choimory/choimory-dev-member-api
    newTag: prod-bootstrap

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: choimory-dev-member-api
      spec:
        template:
          spec:
            containers:
              - name: choimory-dev-member-api
                env:
                  # member-api의 application-prod.yml을 사용한다.
                  - name: SPRING_PROFILES_ACTIVE
                    value: prod
                resources:
                  requests:
                    cpu: 100m
                    memory: 384Mi
                  limits:
                    memory: 768Mi
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: choimory-dev-member-api
      spec:
        hostnames:
          - api.choimory.dev
