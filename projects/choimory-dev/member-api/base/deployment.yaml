# 회원 API 서버
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choimory-dev-member-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: choimory-dev-member-api
  template:
    metadata:
      labels:
        app: choimory-dev-member-api
    spec:
      containers:
        - name: choimory-dev-member-api
          # 태그는 앱 레포 Actions가 overlay의 images 항목을 수정해 변경한다.
          image: ghcr.io/choimory/choimory-dev-member-api
          ports:
            - name: http
              containerPort: 8080
            # actuator 전용 포트. Service에 포함하지 않아 외부로 노출되지 않는다.
            - name: management
              containerPort: 8081
          env:
            # 컨테이너 메모리 상한에 맞춰 JVM 힙 크기를 정한다.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            # DB 접속 정보는 CloudNativePG가 자동 생성한 Secret에서 주입한다.
            - name: rdb-host
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-app
                  key: host
            - name: rdb-port
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-app
                  key: port
            - name: rdb-database
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-app
                  key: dbname
            - name: rdb-user
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-app
                  key: user
            - name: rdb-password
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-app
                  key: password
            # 같은 네임스페이스의 data/base/redis.yaml Service로 접속한다.
            - name: redis-host
              value: choimory-dev-redis
            - name: redis-port
              value: "6379"
            # ACL을 쓰지 않아 비어 있지만, 앱 설정에 기본값이 없어 환경변수 자체는 필요하다.
            - name: redis-username
              value: ""
            # 아래 Secret은 6단계에서 SealedSecret으로 생성한다.
            - name: redis-password
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-redis-secret
                  key: password
            - name: jwt-secret
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-member-api-secret
                  key: jwt-secret
          # Spring Boot와 Flyway 기동 시간을 고려해 최대 3분까지 기다린다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
