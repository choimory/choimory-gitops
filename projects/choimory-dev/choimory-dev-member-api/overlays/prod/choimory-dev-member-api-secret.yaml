# member-api의 JWT 서명 키(HS256, 32바이트 이상)
# kubeseal로 암호화한 값이라 커밋해도 되며, 이 네임스페이스와 이름에서만 풀린다.
# 다시 만들기: histories의 k8s-setup/task5.md "SealedSecret 생성 (서버)" 참고. 바꾸면 기존 로그인 토큰이 모두 무효가 된다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: choimory-dev-member-api-secret
  namespace: choimory-dev-prod
spec:
  encryptedData:
    jwt-secret: 
  template:
    metadata:
      name: choimory-dev-member-api-secret
      namespace: choimory-dev-prod
