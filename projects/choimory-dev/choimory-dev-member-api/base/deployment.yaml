# 회원 API 서버
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choimory-dev-member-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: choimory-dev-member-api
  template:
    metadata:
      labels:
        app: choimory-dev-member-api
    spec:
      containers:
        - name: choimory-dev-member-api
          # 태그는 앱 레포 Actions가 overlay의 images 항목을 수정해 변경한다.
          image: ghcr.io/choimory/choimory-dev-member-api
          ports:
            - name: http
              containerPort: 8080
            # actuator 전용 포트. Service에 포함하지 않아 외부로 노출되지 않는다.
            - name: management
              containerPort: 8081
          env:
            # 컨테이너 메모리 상한에 맞춰 JVM 힙 크기를 정한다.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            # 같은 네임스페이스의 CloudNativePG primary Service로 접속한다.
            - name: rdb-host
              value: choimory-dev-postgres-rw
            - name: rdb-port
              value: "5432"
            - name: rdb-database
              value: member
            # member 도메인 계정. postgres overlay의 SealedSecret(basic-auth)에서 주입한다.
            - name: rdb-user
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-member
                  key: username
            - name: rdb-password
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-postgres-member
                  key: password
            # 같은 네임스페이스의 redis/base/service.yaml Service로 접속한다.
            - name: redis-host
              value: choimory-dev-redis
            - name: redis-port
              value: "6379"
            # Redis ACL 사용자. redis overlay의 SealedSecret에서 주입한다.
            - name: redis-username
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-redis-secret
                  key: username
            - name: redis-password
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-redis-secret
                  key: password
            # Redis database 번호는 도메인별로 나눈다 (0: api-gateway 예약, 1: member).
            # 앱 설정에 자리가 없어 Spring Boot 표준 환경변수 이름으로 지정한다.
            - name: SPRING_DATA_REDIS_DATABASE
              value: "1"
            - name: jwt-secret
              valueFrom:
                secretKeyRef:
                  name: choimory-dev-member-api-secret
                  key: jwt-secret
          # Spring Boot와 Flyway 기동 시간을 고려해 최대 3분까지 기다린다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
