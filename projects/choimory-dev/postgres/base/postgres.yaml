# CloudNativePG가 관리하는 PostgreSQL. 저장 크기와 메모리는 환경별 overlay에서 지정한다.
# member-api는 choimory-dev-postgres-member Secret(계정)과 choimory-dev-postgres-rw Service로 접속한다.
# 주의: 삭제하면 DB Pod와 PVC가 함께 삭제된다. 데이터 폴더는 Retain으로 남지만 복구는 수동이다.
# 주의: initdb(DB, 계정)는 처음 만들 때만 적용된다. 바꾸려면 Cluster를 삭제해 다시 만들어야 한다(데이터 삭제).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: choimory-dev-postgres
spec:
  # 노드가 1대라 복제본을 두어도 장애 대비가 되지 않는다.
  instances: 1
  # 인스턴스가 1개일 때 PDB가 있으면 노드 drain이 막힌다.
  enablePDB: false
  bootstrap:
    # 계정은 도메인별로 둔다(choimory_dev_{도메인}). 비밀번호는 overlay의 SealedSecret(basic-auth)으로 지정해
    # CNPG가 -app Secret을 자동 생성하지 않는다. username은 owner와 같아야 한다.
    initdb:
      database: member
      owner: choimory_dev_member
      secret:
        name: choimory-dev-postgres-member
  storage:
    # 데이터가 /data/dev/choimory-dev/k8s/<네임스페이스>/<PVC 이름>/ 에 저장된다.
    storageClass: local-path-choimory-dev
    size: 5Gi
  managed:
    services:
      # tailnet에서 primary(쓰기)에 접속하기 위한 Service. CNPG가 만들고 primary를 따라가도록 selector를 관리한다.
      # Tailscale Operator가 이 Service를 tailnet 기기로 노출한다. 기기 이름은 환경별 overlay에서 지정한다.
      # 주의: overlay가 JSON 패치로 additional[0]에 annotation을 넣으므로 순서를 바꾸면 overlay도 함께 고친다.
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: choimory-dev-postgres-tailnet
            spec:
              type: LoadBalancer
              loadBalancerClass: tailscale
