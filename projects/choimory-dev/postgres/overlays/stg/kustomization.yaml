# stg 환경 PostgreSQL. 운영보다 적은 자원을 사용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: choimory-dev-stg

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: choimory-dev-postgres
      spec:
        postgresql:
          parameters:
            shared_buffers: 32MB
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
  # tailnet 기기 이름. Cluster 안의 목록 항목이라 병합 패치 대신 JSON 패치로 annotation만 추가한다.
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: choimory-dev-postgres
    patch: |-
      - op: add
        path: /spec/managed/services/additional/0/serviceTemplate/metadata/annotations
        value:
          tailscale.com/hostname: choimory-dev-postgres-stg
