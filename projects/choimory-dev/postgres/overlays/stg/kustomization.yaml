# stg 환경 PostgreSQL. 운영보다 적은 자원을 사용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: choimory-dev-stg

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: choimory-dev-postgres
      spec:
        postgresql:
          parameters:
            shared_buffers: 32MB
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
