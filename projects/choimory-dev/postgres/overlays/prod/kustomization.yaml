# prod 환경 PostgreSQL
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: choimory-dev-prod

resources:
  - ../../base
  - choimory-dev-postgres-member.yaml

patches:
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: choimory-dev-postgres
      spec:
        postgresql:
          parameters:
            shared_buffers: 128MB
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        # 주의: local-path는 크기를 실제로 제한하지 않으며 표시용 값이다.
        storage:
          size: 10Gi
  # tailnet 기기 이름. Cluster 안의 목록 항목이라 병합 패치 대신 JSON 패치로 annotation만 추가한다.
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: choimory-dev-postgres
    patch: |-
      - op: add
        path: /spec/managed/services/additional/0/serviceTemplate/metadata/annotations
        value:
          tailscale.com/hostname: choimory-dev-postgres-prod
