# PostgreSQL member 도메인 계정(basic-auth). CNPG initdb와 member-api가 같은 Secret을 읽는다.
# kubeseal로 암호화한 값이라 커밋해도 되며, 이 네임스페이스와 이름에서만 풀린다.
# 다시 만들기: histories의 domain-connect/task6.md "SealedSecret 생성 (서버)" 참고. initdb는 처음 만들 때만 적용되므로 비밀번호 변경은 DB에서 직접 한다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: choimory-dev-postgres-member
  namespace: choimory-dev-prod
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: choimory-dev-postgres-member
      namespace: choimory-dev-prod
    type: kubernetes.io/basic-auth
