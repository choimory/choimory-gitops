# 페이지 도메인의 모든 경로를 front로 전달한다. 도메인은 환경별 overlay에서 지정한다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: front
spec:
  parentRefs:
    - name: shared-gateway
      namespace: infrastructure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: front
          port: 3000
