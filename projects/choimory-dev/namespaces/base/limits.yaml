# 네임스페이스 전체의 메모리 상한. 값은 환경별 overlay에서 지정한다.
# 주의: 롤링 업데이트 중 새 Pod가 함께 떠도 넘지 않도록 Pod 상한 합계보다 여유 있게 잡아야 한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory-quota
spec:
  hard:
    limits.memory: 2Gi
---
# 값을 적지 않은 컨테이너에 적용되는 기본 메모리. ResourceQuota는 limits가 없는 Pod를 거부한다.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
      default:
        memory: 256Mi
