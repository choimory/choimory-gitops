# choimory-tunnel 인증 파일. cloudflared가 이 파일로 Tunnel에 접속한다.
# kubeseal로 암호화한 값이라 커밋해도 되며, 이 네임스페이스와 이름에서만 풀린다.
# 다시 만들기: histories의 domain-connect/task3.md "인증 파일 암호화" 참고. Tunnel을 다시 만들면 config.yaml의 tunnel ID도 바꿔야 한다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: choimory-cloudflared-credentials
  namespace: choimory-infra
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      name: choimory-cloudflared-credentials
      namespace: choimory-infra
