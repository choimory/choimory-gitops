# Git에 암호화된 Secret을 저장할 수 있게 하는 컨트롤러
# 다른 도구와 프로젝트가 SealedSecret을 쓰므로 가장 먼저 설치한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.22.0
      helm:
        valueFiles:
          - $values/infrastructure/sealed-secrets/values.yaml
    - repoURL: https://github.com/choimory/choimory-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
