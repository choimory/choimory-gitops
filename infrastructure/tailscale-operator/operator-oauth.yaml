# Tailscale Operator가 tailnet에 기기(Operator, 프록시)를 등록할 때 쓰는 OAuth 클라이언트 (태그 tag:k8s-operator)
# Secret 이름 operator-oauth와 키 client_id, client_secret은 Operator 차트가 기본으로 찾는 값이다.
# kubeseal로 암호화한 값이라 커밋해도 되며, 이 네임스페이스와 이름에서만 풀린다.
# 다시 만들기: histories의 domain-connect/task4.md "A-4 (OAuth 부분)" 참고. Tailscale 관리 화면 Trust credentials에서 재발급.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: operator-oauth
  namespace: choimory-infra
spec:
  encryptedData:
    client_id: 
    client_secret: 
  template:
    metadata:
      name: operator-oauth
      namespace: choimory-infra
