# Tailscale Operator Helm 설정
# OAuth 자격 증명은 같은 디렉토리의 SealedSecret operator-oauth를 쓴다. oauth 블록은 비워 둔다.
# 주의: nameOverride, fullnameOverride를 바꾸면 Secret 이름(<fullname>-oauth)과 Operator 기기가 새로 만들어진다.

operatorConfig:
  # tailnet에 표시되는 Operator 기기 이름. 태그는 기본값 tag:k8s-operator
  hostname: choimory-k8s-operator
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Operator가 만드는 프록시 기기(infra-gateway, 이후 DB)의 태그는 기본값 tag:k8s를 쓴다.
# tagOwners에 tag:k8s-operator가 tag:k8s의 소유자로 등록되어 있어야 한다.

# Tailscale Ingress는 쓰지 않는다. 인프라 도구는 infra-gateway의 HTTPRoute로 연결한다.
ingressClass:
  enabled: false
